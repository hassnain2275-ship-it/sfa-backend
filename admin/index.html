<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFA Admin Dashboard</title>
<style>
  @font-face { font-family:"IBM Plex Sans"; src:url(fonts/IBMPlexSans-Regular.ttf) format("truetype"); font-weight:400; font-display:swap; }
  @font-face { font-family:"IBM Plex Sans"; src:url(fonts/IBMPlexSans-Medium.ttf) format("truetype"); font-weight:500; font-display:swap; }
  @font-face { font-family:"IBM Plex Sans"; src:url(fonts/IBMPlexSans-SemiBold.ttf) format("truetype"); font-weight:600; font-display:swap; }
  @font-face { font-family:"IBM Plex Sans"; src:url(fonts/IBMPlexSans-Bold.ttf) format("truetype"); font-weight:700; font-display:swap; }

  /* Same tokens as the mobile app (flutter_app/lib/theme/app_theme.dart) */
  :root { --bg:#F3F4F0; --card:#ffffff; --ink:#17211E; --muted:#66726C; --line:#DDE2DB; --line-strong:#B9C2BB;
          --brand:#0F4C42; --on-brand:#ffffff; --side:#0A3730; --accent:#F0B429;
          --ok:#2F7D52; --warn:#9A6410; --bad:#B8432F; --soft:#E1ECE8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1614; --card:#17211E; --ink:#E6ECE8; --muted:#92A09A; --line:#26332E; --line-strong:#3A4A44;
          --brand:#58BFA3; --on-brand:#0A2B25; --side:#0A1F1B; --ok:#66CB93; --warn:#E0A83F; --bad:#F0907E; --soft:#1E2E29; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

  /* Shell: brand + header on top, navigation down the left, content right */
  #app { display:grid; grid-template-columns:236px minmax(0,1fr); grid-template-rows:60px 1fr; grid-template-areas:"brand head" "nav main"; min-height:100vh; }
  .brand { grid-area:brand; display:flex; align-items:center; gap:10px; padding:0 20px; background:var(--side); color:#fff; font-weight:600; font-size:17px; position:sticky; top:0; z-index:6; }
  .mark { width:30px; height:30px; border-radius:9px; background:var(--accent); display:inline-flex; align-items:center; justify-content:center; }
  .mark svg { width:62%; height:62%; }
  header { grid-area:head; display:flex; align-items:center; gap:12px; padding:0 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; font-weight:600; margin:0; flex:1; }
  header .who { color:var(--muted); font-size:13px; }
  nav { grid-area:nav; display:flex; flex-direction:column; gap:2px; padding:8px 10px 24px; background:var(--side); position:sticky; top:60px; height:calc(100vh - 60px); overflow-y:auto; }
  nav button { border:0; background:none; text-align:left; padding:10px 12px; color:rgba(255,255,255,.72); font:inherit; font-weight:500; border-radius:8px; cursor:pointer; }
  nav button:hover { background:rgba(255,255,255,.07); color:#fff; }
  nav button.on { color:#fff; font-weight:600; background:rgba(255,255,255,.1); box-shadow:inset 3px 0 0 var(--accent); }
  nav button:focus-visible { outline-color:var(--accent); }
  main { grid-area:main; padding:22px 28px 48px; width:100%; max-width:1360px; }

  .bar { display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin-bottom:18px; }
  label { font-size:12.5px; font-weight:500; color:var(--muted); display:block; margin-bottom:4px; }
  input, select { padding:8px 10px; border:1px solid var(--line-strong); border-radius:10px; background:var(--card); color:var(--ink); font:inherit; }
  input:focus, select:focus { border-color:var(--brand); outline:2px solid var(--brand); outline-offset:-1px; }
  button.btn { padding:9px 16px; border:1px solid var(--brand); background:var(--brand); color:var(--on-brand); border-radius:10px; cursor:pointer; font:inherit; font-weight:600; }
  button.btn:hover { filter:brightness(1.08); }
  button.btn.alt { background:transparent; color:var(--brand); border-color:var(--line-strong); }
  button.btn.small { padding:4px 10px; font-size:12.5px; border-radius:8px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card .n { font-size:28px; line-height:1.15; font-weight:600; font-variant-numeric:tabular-nums; }
  .card .l { color:var(--muted); font-size:13px; margin-top:2px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:auto; margin-bottom:20px; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  th { font-size:12.5px; font-weight:600; color:var(--muted); background:var(--bg); position:sticky; top:0; }
  tbody tr:hover td { background:var(--bg); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.total td { font-weight:600; background:var(--soft); }
  .tag { padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; background:var(--bg); }
  .present, .synced { color:var(--ok); } .absent, .error { color:var(--bad); } .out_of_range, .pending { color:var(--warn); }
  .note { color:var(--muted); font-size:13px; margin:6px 0 16px; }
  .msg { padding:11px 14px; border-radius:10px; margin-bottom:14px; background:var(--bg); }
  .msg.bad { color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--card)); }

  #login { max-width:380px; margin:10vh auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px 28px; }
  #login .mark { width:46px; height:46px; border-radius:13px; margin-bottom:18px; }
  #login h2 { font-size:22px; font-weight:600; line-height:1.2; }
  #login input { width:100%; margin-bottom:14px; }
  #login button.btn { padding:11px 16px; }
  .wrapcell { white-space:normal; min-width:240px; max-width:420px; }
  .bar2 { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:8px; } .bar2 > i { display:block; height:100%; background:var(--brand); }
  .grid input { width:100%; min-width:110px; } .formrow { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; } .formrow > div { min-width:150px; }
  .hide { display:none !important; }


  #toasts { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:min(380px,calc(100vw - 40px)); }
  .toast { background:var(--side); color:#fff; padding:11px 16px; border-radius:10px; font-size:13.5px; box-shadow:0 6px 24px rgba(0,0,0,.22); }
  .toast.bad { background:var(--bad); }
  #modal { position:fixed; inset:0; background:rgba(10,20,17,.5); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px; }
  #modal.hide { display:none; }
  .dlg { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; width:min(400px,100%); }
  .dlg p { margin:0 0 14px; font-weight:500; }
  .dlg input { width:100%; margin-bottom:14px; }
  .dlg .act { display:flex; gap:10px; justify-content:flex-end; }

  @media (max-width: 860px) {
    #app { grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto auto 1fr; grid-template-areas:"brand" "head" "nav" "main"; }
    .brand { height:52px; position:static; }
    header { height:56px; padding:0 16px; }
    nav { flex-direction:row; overflow-x:auto; overflow-y:hidden; height:auto; position:static; padding:8px 10px; }
    nav button { white-space:nowrap; }
    nav button.on { box-shadow:inset 0 -3px 0 var(--accent); }
    main { padding:16px 14px 40px; }
  }
  @media (prefers-reduced-motion: no-preference) { button.btn, nav button { transition:background .15s, filter .15s; } }
</style>
</head>
<body>

<section id="login" class="hide">
  <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#17211E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8"/><path d="M12 12 6.5 6.5"/><path d="M12 12l5.5-5.5"/><path d="M6.5 11V6.5H11"/><path d="M17.5 11V6.5H13"/></svg></span>
  <h2 style="margin-top:0">Sign in to the dashboard</h2>
  <label>Email / User Code</label><input id="u" autocomplete="username" autocapitalize="none">
  <label>Password</label><input id="p" type="password" autocomplete="current-password">
  <div id="loginErr" class="msg bad hide"></div>
  <button class="btn" style="width:100%" onclick="doLogin()">Log in</button>
  <p class="note">For supervisors and admins. Field employees use the mobile app.</p>
</section>

<div id="app" class="hide">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#17211E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8"/><path d="M12 12 6.5 6.5"/><path d="M12 12l5.5-5.5"/><path d="M6.5 11V6.5H11"/><path d="M17.5 11V6.5H13"/></svg></span><span>SFA</span></div>
  <header>
    <h1>Admin dashboard</h1>
    <span class="who" id="who"></span>
    <button class="btn alt small" onclick="logout()">Log out</button>
  </header>
  <nav id="nav"></nav>
  <main>
    <div class="bar" id="filters"></div>
    <div id="out"></div>
  </main>
</div>

<div id="toasts"></div>
<div id="modal" class="hide"><div class="dlg"><p id="mTxt"></p><input id="mIn" class="hide"><div class="act"><button class="btn alt" id="mNo">Cancel</button><button class="btn" id="mYes">OK</button></div></div></div>
<script>
'use strict';
const API = 'https://sfa-backend-wniw.onrender.com/api/v1';
let token = sessionStorage.getItem('sfa_admin_token');
let me = null, employees = [], page = 'overview';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const money = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = (n) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Karachi' });


function friendly(e) {
  console.error(e); // technical detail goes to the browser console only
  const m = (e && e.message) ? String(e.message) : '';
  if (!m || /failed to fetch|networkerror|load failed|network request failed/i.test(m)) return 'Cannot reach the server. Check your connection and try again.';
  return m;
}
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), bad ? 6500 : 3500);
}
function dialog(msg, withInput, def) {
  return new Promise((res) => {
    const i = $('mIn'); $('mTxt').textContent = msg; i.classList.toggle('hide', !withInput); i.value = def || '';
    $('modal').classList.remove('hide'); (withInput ? i : $('mYes')).focus();
    const done = (v) => { $('modal').classList.add('hide'); res(v); };
    $('mYes').onclick = () => done(withInput ? i.value : true);
    $('mNo').onclick = () => done(withInput ? null : false);
    i.onkeydown = (ev) => { if (ev.key === 'Enter') $('mYes').click(); if (ev.key === 'Escape') $('mNo').click(); };
  });
}
const askConfirm = (m) => dialog(m, false);
const askText = (m, d) => dialog(m, true, d);

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
  const isJson = (r.headers.get('content-type') || '').includes('json');
  if (r.status === 401) { logout(); throw new Error('Session expired - please log in again'); }
  const body = isJson ? await r.json() : await r.blob();
  if (!r.ok) {
    if (r.status >= 500) { console.error('Server error', r.status, body); throw new Error('Something went wrong on the server. Please try again in a moment.' + (body && body.ref ? ' (ref ' + body.ref + ')' : '')); }
    throw new Error((body && body.error) || 'Something went wrong. Please try again.');
  }
  return body;
}

async function doLogin() {
  $('loginErr').classList.add('hide');
  try {
    const u = $('u').value.trim();
    const r = await fetch(API + '/auth/admin-login', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: u, username: u, password: $('p').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Login failed');
    if (!['admin', 'supervisor'].includes(j.user.role)) throw new Error('This dashboard is for supervisors and admins only.');
    token = j.token; sessionStorage.setItem('sfa_admin_token', token);
    await start();
  } catch (e) { $('loginErr').textContent = friendly(e); $('loginErr').classList.remove('hide'); }
}
function logout() { sessionStorage.removeItem('sfa_admin_token'); token = null; $('app').classList.add('hide'); $('login').classList.remove('hide'); }

async function start() {
  try { me = await api('/admin/me'); employees = await api('/admin/employees'); }
  catch (e) { logout(); $('loginErr').textContent = friendly(e); $('loginErr').classList.remove('hide'); return; }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = me.name + ' (' + me.role + ')';
  const tabs = [['overview', 'Overview'], ['attendance', 'Attendance'], ['photos', 'Market Photos'], ['daily', 'Daily Activity'], ['locations', 'Location History'], ['orders', 'Secondary Sales'],
    ['visits', 'Shop Visits'], ['plans', 'Plans'], ['planreport', 'Plan vs Achieved'], ['sapreports', 'SAP Reports'], ['corrections', 'Corrections'], ['sync', 'SAP Sync Health']];
  if (me.role === 'admin') tabs.push(['master', 'Master Data'], ['users', 'Users & Roles'], ['settings', 'Settings'], ['audit', 'Audit Log']);
  $('nav').innerHTML = tabs.map(([k, t]) => '<button data-k="' + k + '" onclick="go(\'' + k + '\')">' + t + '</button>').join('');
  go('overview');
}

function filtersHtml(withEmp) {
  return '<div><label>From</label><input type="date" id="f_from" value="' + (window._from || today()) + '"></div>' +
    '<div><label>To</label><input type="date" id="f_to" value="' + (window._to || today()) + '"></div>' +
    (withEmp ? '<div><label>Employee</label><select id="f_emp"><option value="">All</option>' +
      employees.map((e) => '<option value="' + e.id + '"' + (String(window._emp) === String(e.id) ? ' selected' : '') + '>' + esc(e.name) + '</option>').join('') + '</select></div>' : '') +
    '<button class="btn" onclick="go(page)">Show</button>';
}
function qs() {
  const from = $('f_from') ? $('f_from').value : '', to = $('f_to') ? $('f_to').value : '', emp = $('f_emp') ? $('f_emp').value : '';
  window._from = from; window._to = to; window._emp = emp;
  const p = new URLSearchParams(); if (from) p.set('from', from); if (to) p.set('to', to); if (emp) p.set('employee_id', emp);
  return p.toString();
}
async function download(kind) {
  try {
    const blob = await api('/admin/export/' + kind + '?' + qs());
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = kind + '.xlsx'; a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { toast(friendly(e), true); }
}
function table(cols, rows, totalRow) {
  if (!rows.length) return '<div class="box"><div style="padding:16px;color:var(--muted)">No records for this selection.</div></div>';
  const head = cols.map((c) => '<th class="' + (c.num ? 'num' : '') + '">' + esc(c.h) + '</th>').join('');
  const body = rows.map((r) => '<tr>' + cols.map((c) => {
    const raw = c.html ? c.html(r) : esc(c.f ? c.f(r[c.k], r) : r[c.k]);
    return '<td class="' + (c.num ? 'num ' : '') + (c.wrap ? 'wrapcell' : '') + '">' + raw + '</td>';
  }).join('') + '</tr>').join('');
  const tot = totalRow ? '<tr class="total">' + cols.map((c, i) => '<td class="' + (c.num ? 'num' : '') + '">' + (i === 0 ? 'TOTAL' : esc(totalRow[c.k] != null ? (c.f ? c.f(totalRow[c.k]) : totalRow[c.k]) : '')) + '</td>').join('') + '</tr>' : '';
  return '<div class="box"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + tot + '</tbody></table></div>';
}
const tag = (s, label) => '<span class="tag ' + esc(s) + '">' + esc(label || String(s).replace('_', ' ')) + '</span>';

async function go(k) {
  page = k;
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.k === k));
  const out = $('out'); out.innerHTML = '<p class="note">Loading...</p>';
  try {
    if (k === 'overview') { $('filters').innerHTML = ''; return await overview(out); }
    if (k === 'attendance') { $('filters').innerHTML = filtersHtml(true); return await attendance(out); }
    if (k === 'orders') { $('filters').innerHTML = filtersHtml(true); return await orders(out); }
    if (k === 'visits') { $('filters').innerHTML = filtersHtml(true); return await visits(out); }
    if (k === 'locations') { $('filters').innerHTML = filtersHtml(true).replace('<label>To</label><input type="date" id="f_to" value="' + (window._to || today()) + '">', '<label>(one day)</label><input type="date" id="f_to" value="' + (window._to || today()) + '" disabled>'); return await locations(out); }
    if (k === 'plans') { $('filters').innerHTML = ''; return await plans(out); }
    if (k === 'planreport') { return await planReport(out); }
    if (k === 'sapreports') { $('filters').innerHTML = ''; return await sapReports(out); }
    if (k === 'photos') { $('filters').innerHTML = filtersHtml(true); return await photos(out); }
    if (k === 'daily') { $('filters').innerHTML = filtersHtml(true); return await daily(out); }
    if (k === 'corrections') { $('filters').innerHTML = ''; return await corrections(out); }
    if (k === 'master') { $('filters').innerHTML = ''; return await master(out); }
    if (k === 'settings') { $('filters').innerHTML = ''; return await settings(out); }
    if (k === 'sync') { $('filters').innerHTML = ''; return await sync(out); }
    if (k === 'users') { $('filters').innerHTML = ''; return await users(out); }
    if (k === 'audit') { $('filters').innerHTML = ''; return await auditLog(out); }
  } catch (e) { out.innerHTML = '<div class="msg bad">' + esc(friendly(e)) + '</div>'; }
}


// ---------------- SAP Reports (read live from SAP) ----------------
const SR = {
  'region-sales': { title: 'Invoice Wise Region Sales', kind: 'Invoices', note: 'Provisional. Built from the client\'s saved query; compare the totals with SAP\'s own report before relying on it.', filters: ['item', 'region', 'town', 'area', 'customer'] },
  'monthly-sales': { title: 'Monthly sales', kind: 'Sales orders', note: 'Sales orders in SAP, grouped by month and customer. Amounts are before tax.', filters: ['item', 'customer'] },
  'party-wise': { title: 'Party wise sales', kind: 'Sales orders', note: 'Sales orders in SAP, grouped by customer. Amounts are before tax.', filters: ['item', 'customer'] },
  'customer-status': { title: 'Monthly customer status', kind: 'Sales orders', note: 'Orders, amount before tax and last order date per customer per month.', filters: ['item', 'customer'] },
  'order-lines': { title: 'Order lines with brand', kind: 'Sales orders', note: 'Every order line with sales employee and brand (the item group).', filters: ['item', 'customer'] },
};
const SR_LABEL = { item: ['Item code(s)', 'e.g. FG20046'], region: ['Region', 'e.g. SOUTH KPK'], town: ['Town', 'e.g. WANNA'], area: ['Area', 'e.g. WAZIRISTAN'], customer: ['Customer code(s)', 'e.g. CUS-0279'] };
async function sapReports(out) {
  const first = today().slice(0, 8) + '01';
  out.innerHTML = '<div class="bar"><div><label>Report</label><select id="sr_name" onchange="srPick()">' +
    Object.keys(SR).map((k) => '<option value="' + k + '">' + esc(SR[k].title) + ' (' + SR[k].kind.toLowerCase() + ')</option>').join('') + '</select></div>' +
    '<div><label>From</label><input type="date" id="sr_from" value="' + first + '"></div><div><label>To</label><input type="date" id="sr_to" value="' + today() + '"></div>' +
    '<span id="srFilters" style="display:contents"></span>' +
    '<button class="btn" onclick="runSapReport()">Show</button><button class="btn alt" onclick="downloadSapReport()">Excel</button></div>' +
    '<div id="srNote" class="msg" style="background:var(--soft)"></div><div id="srOut"></div>';
  srPick();
}
function srPick() {
  const r = SR[$('sr_name').value];
  $('srFilters').innerHTML = r.filters.map((k) => '<div><label>' + SR_LABEL[k][0] + '</label><input id="sr_' + k + '" placeholder="' + SR_LABEL[k][1] + '" style="width:150px"></div>').join('');
  $('srNote').innerHTML = '<b>' + esc(r.title) + '</b> &middot; read live from SAP (' + r.kind.toLowerCase() + '). ' + esc(r.note) + ' Several codes can be separated with commas.';
  $('srOut').innerHTML = '';
}
function srParams() {
  const p = new URLSearchParams();
  ['from', 'to', 'item', 'region', 'town', 'area', 'customer'].forEach((k) => { const el = $('sr_' + k); const v = el ? el.value.trim() : ''; if (v) p.set(k, v); });
  return p.toString();
}
async function runSapReport() {
  const box = $('srOut'); box.innerHTML = '<p class="note">Reading from SAP...</p>';
  try {
    const d = await api('/admin/sap-reports/' + encodeURIComponent($('sr_name').value) + '?' + srParams());
    const n = (v) => Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const tot = {};
    const cols = d.columns.map((c) => {
      if (c.total) tot[c.key] = d.rows.reduce((s, r) => s + (Number(r[c.key]) || 0), 0);
      return c.type === 'n' ? { h: c.label, k: c.key, num: true, f: n } : { h: c.label, k: c.key };
    });
    box.innerHTML = '<p class="note">' + d.rows.length + ' row(s)' + (d.truncated ? ' - only the first 5,000 are shown, narrow the dates or filters' : '') + '</p>' + table(cols, d.rows, Object.keys(tot).length ? tot : undefined);
  } catch (e) { box.innerHTML = '<div class="msg bad">' + esc(friendly(e)) + '</div>'; }
}
async function downloadSapReport() {
  try {
    const name = $('sr_name').value;
    const blob = await api('/admin/sap-reports/' + encodeURIComponent(name) + '/export?' + srParams());
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.xlsx'; a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { toast(friendly(e), true); }
}

async function overview(out) {

function importRoutes(inp) {

      if (r.routes.length) $('routeBody').innerHTML = r.routes.map(routeRow).join('');
      const eb = $('pf_err');
      if (r.errors.length) { eb.innerHTML = r.errors.map(esc).join('<br>'); eb.classList.remove('hide'); } else { eb.classList.add('hide'); }
      toast(r.routes.length + ' route row(s) loaded' + (r.errors.length ? ', ' + r.errors.length + ' skipped' : '') + '. Check them, then press Save plan.', r.routes.length === 0);
    } catch (e) { toast(friendly(e), true); }
    inp.value = '';
  };

}

async function sapStatus() {
  $('sapst').textContent = 'Checking...';
  try { const r = await api('/admin/sap-status'); $('sapst').textContent = r.reachable ? (r.sap_connected ? 'Bridge reachable, connected to SAP' : 'Bridge reachable, but NOT connected to SAP') : 'Bridge NOT reachable: ' + r.error; }
  catch (e) { $('sapst').textContent = friendly(e); }
}

async function deliverOrder(id) {
  if (!(await askConfirm('Create the SAP Delivery for this order? This takes the stock out of the SAP warehouse and cannot be undone from here.'))) return;
  try {
    const r = await api('/admin/orders/' + Number(id) + '/deliver', { method: 'POST', body: '{}' });
    toast('Delivery created in SAP' + (r.delivery_no ? ' (no. ' + Number(r.delivery_no) + ')' : '') + '. Stock will refresh shortly.');
    await go('orders');
  } catch (e) { toast(friendly(e), true); }
}
async function orders(out) {
  const d = await api('/admin/orders?' + qs());
  out.innerHTML = '<div style="margin-bottom:10px"><button class="btn alt" onclick="download(\'orders\')">Export Excel</button></div>' +
    table([{ h: 'Date', k: 'order_date' }, { h: 'SFA No', k: 'sfa_no' }, { h: 'Employee', k: 'employee' }, { h: 'Shop', k: 'shop' }, { h: 'Location', k: 'location', wrap: true },
      { h: 'SKUs', k: 'skus', wrap: true }, { h: 'Qty', k: 'qty', num: true, f: qty }, { h: 'Weight (KG)', k: 'weight_kg', num: true, f: qty },
      { h: 'Value', k: 'value', num: true, f: money }, { h: 'SAP', html: (r) => tag(r.sync_status) }, { h: 'Discount', html: (r) => r.manual_discount ? '<span class="tag out_of_range">Typed by employee</span>' : '' },
      { h: 'Delivery', html: (r) => r.delivery_status === 'delivered' ? '<span class="tag present">Delivered' + (r.sap_delivery_doc_num ? ' #' + Number(r.sap_delivery_doc_num) : '') + '</span>'
        : (r.sync_status === 'synced' ? '<button class="btn alt small" onclick="deliverOrder(' + Number(r.id) + ')">Mark delivered</button>' : '') }], d.rows,
      { qty: d.totals.qty, weight_kg: d.totals.weight_kg, value: d.totals.value }) +
    '<p class="note">' + d.totals.orders + ' orders. Shop mobile number is not captured by the app yet.</p>';
}
async function visits(out) {
  const d = await api('/admin/visit-summary?' + qs());
  const t = d.totals;
  out.innerHTML = '<div style="margin-bottom:10px"><button class="btn alt" onclick="download(\'visit-summary\')">Export Excel</button></div>' +
    '<div class="cards"><div class="card"><div class="n">' + t.visited + '</div><div class="l">Shops visited</div></div><div class="card"><div class="n">' + t.productive +
    '</div><div class="l">Productive</div></div><div class="card"><div class="n">' + t.non_productive + '</div><div class="l">Non-productive</div></div></div>' +
    table([{ h: 'Date', k: 'day' }, { h: 'Employee', k: 'employee' }, { h: 'Shops visited', k: 'visited', num: true }, { h: 'Productive', k: 'productive', num: true },
      { h: 'Non-productive', k: 'non_productive', num: true }], d.rows) +
    '<p class="note">Visits are counted from check-ins matched to a shop plus shops that received an order that day. Full visit tracking arrives with the route plan.</p>';
}
async function sync(out) {
  const d = await api('/admin/sync-health');
  const c = (n, l) => '<div class="card"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
  let h = '<h3>Orders to SAP</h3><div class="cards">' + c(d.orders.synced, 'Synced') + c(d.orders.pending, 'Pending') + c(d.orders.error, 'Failed') + '</div>' +
    '<h3>Time sheets to SAP</h3><div class="cards">' + c(d.timesheets.synced, 'Synced') + c(d.timesheets.pending, 'Pending') + c(d.timesheets.failed, 'Failed') + '</div>' +
    '<h3>Failed orders</h3>' + table([{ h: 'Date', k: 'order_date' }, { h: 'Employee', k: 'employee' }, { h: 'Shop', k: 'shop' }, { h: 'Value', k: 'value', num: true, f: money },
      ...(d.can_retry ? [{ h: 'Error', k: 'sync_error', wrap: true }, { h: '', html: (r) => '<button class="btn small" onclick="retry(' + r.id + ')">Retry</button>' }] : [])], d.failed_orders);
  if (d.can_retry) {
    h += '<h3>Failed time sheets</h3>' + table([{ h: 'Day', k: 'day' }, { h: 'Employee', k: 'employee' }, { h: 'Error', k: 'error', wrap: true }], d.failed_timesheets || []);
    h += '<h3>Recent sync log</h3>' + table([{ h: 'When', k: 'ran_at' }, { h: 'Type', k: 'sync_type' }, { h: 'Status', html: (r) => tag(r.status === 'success' ? 'synced' : 'error') },
      { h: 'Records', k: 'records_processed', num: true }, { h: 'Message', k: 'message', wrap: true }], d.recent_log || []);
  } else h += '<p class="note">Supervisors see counts and their team\'s failed orders. Error details and retry are admin-only.</p>';
  out.innerHTML = h;
}
async function retry(id) {
  if (!(await askConfirm('Send this order back to the SAP sync queue?'))) return;
  try { await api('/admin/orders/' + id + '/retry', { method: 'POST' }); go('sync'); } catch (e) { toast(friendly(e), true); }
}
async function users(out) {
  const list = await api('/admin/users');
  const mgrs = list.filter((u) => u.role === 'supervisor' || u.role === 'admin').map((u) => u.name);
  const rows = list.map((u) => '<tr><td>' + esc(u.name) + '</td><td>' + esc(u.email) + '</td><td>' + esc(u.sap_code) + '</td><td>' + esc(u.designation) + '</td>' +
    '<td>' + (u.is_active ? tag('synced', 'active') : tag('error', 'inactive')) + '</td>' +
    '<td><select onchange="setRole(' + u.id + ', this.value)">' + ['salesman', 'supervisor', 'admin'].map((r) => '<option' + (r === u.role ? ' selected' : '') + '>' + r + '</option>').join('') + '</select></td>' +
    '<td><select onchange="setManager(' + u.id + ', this.value)"><option value="">-</option>' + mgrs.map((m) => '<option' + (m === u.manager_name ? ' selected' : '') + '>' + esc(m) + '</option>').join('') + '</select></td></tr>').join('');
  out.innerHTML = '<div class="box"><table><thead><tr><th>Name</th><th>Email</th><th>SAP code</th><th>Designation</th><th>Status</th><th>Role</th><th>Reports to (team)</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="note">A supervisor sees the employees whose "Reports to" is that supervisor. Changes are written to the audit log. You cannot change your own role.</p>';
}
async function setRole(id, role) { try { await api('/admin/users/' + id + '/role', { method: 'PATCH', body: JSON.stringify({ role }) }); } catch (e) { toast(friendly(e), true); go('users'); } }
async function setManager(id, m) { try { await api('/admin/users/' + id + '/manager', { method: 'PATCH', body: JSON.stringify({ manager_name: m }) }); } catch (e) { toast(friendly(e), true); go('users'); } }
async function auditLog(out) {
  const rows = await api('/admin/audit');
  out.innerHTML = table([{ h: 'When', k: 'at' }, { h: 'By', k: 'actor_name' }, { h: 'Action', k: 'action' }, { h: 'On', f: null, html: (r) => esc(r.entity + ' #' + r.entity_id) },
    { h: 'Detail', wrap: true, html: (r) => esc(r.detail ? JSON.stringify(r.detail) : '') }], rows);
}

(async () => { if (token) await start(); else $('login').classList.remove('hide'); })();
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('login').classList.contains('hide')) doLogin(); });
</script>
